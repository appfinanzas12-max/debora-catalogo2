function showCategory(cat){closeNav();window.location.hash=cat;renderCategory(cat);window.scrollTo({top:0,behavior:'smooth'})}
function showSoon(name){closeNav();window.location.hash='proximamente';renderSoon(name);window.scrollTo({top:0,behavior:'smooth'})}
function renderHome(){document.getElementById('app').innerHTML=`<section class="hero"><div class="hero-presentation"><img class="hero-logo" src="${HERO_IMAGE}" alt="DEBORA · Sex Shop | Bienestar Íntimo" onload="this.classList.remove('retracted')"></div><div class="eyebrow">CATÁLOGO DEBORA</div><h1>Elegancia. Intimidad.<br><span style="color:var(--pink)">A tu manera.</span></h1><p>Explora nuestra selección de productos de forma cómoda, discreta e interactiva. Elige una categoría para comenzar.</p></section><section class="category-grid"><article class="category-card" onclick="showCategory('vibradores')"><h2>Vibradores con App</h2><p>Productos con control a distancia y tecnología inalámbrica.</p><span class="arrow">Explorar →</span></article><article class="category-card" onclick="showCategory('lenceria')"><h2>Lencería Sexual</h2><p>Lencería y prendas seleccionadas para tu estilo y confianza.</p><span class="arrow">Explorar →</span></article><article class="category-card soon-card" onclick="showSoon('Consoladores')"><h2>Consoladores</h2><p>Estamos preparando esta categoría.</p><span class="soon-pill">PRÓXIMAMENTE</span><span class="arrow">→</span></article><article class="category-card soon-card" onclick="showSoon('Aceites, Lubricantes y Esencias')"><h2>Aceites, Lubricantes y Esencias</h2><p>Nuevos productos estarán disponibles próximamente.</p><span class="soon-pill">PRÓXIMAMENTE</span><span class="arrow">→</span></article><article class="category-card soon-card" onclick="showSoon('Juegos Eróticos')"><h2>Juegos Eróticos</h2><p>Estamos buscando los mejores productos para ti.</p><span class="soon-pill">PRÓXIMAMENTE</span><span class="arrow">→</span></article></section>`}
function card(p){return `<article class="product"><div class="product-media"><img src="${p.image}" alt="${p.name}" loading="lazy"></div><div class="product-body"><span class="tag">${p.tag}</span><span class="code">${p.code}</span><h2>${p.name}</h2><p class="desc">${p.desc}</p><div class="meta">${p.details.slice(0,3).map(d=>`<div><b>${d[0]}:</b> ${d[1]}</div>`).join('')}</div><div class="product-bottom"><div class="price"><small>COSTO</small><strong>${p.price}</strong></div><button class="wa" onclick="addToCart('${p.code}')">AÑADIR AL CARRITO</button></div><button class="back" style="text-align:left;margin-top:12px" onclick='openModal(${JSON.stringify(p.code)})'>Ver detalles →</button></div></article>`}
function renderCategory(cat){const list=products.filter(p=>p.cat===cat);const title=cat==='vibradores'?'Vibradores con App':'Lencería Sexual';document.getElementById('app').innerHTML=`<section class="section"><div class="section-head"><div><button class="back" onclick="goHome()">← Menú principal</button><div class="eyebrow">CATEGORÍA</div><h1>${title}</h1><p>${list.length} productos disponibles · selecciona uno para ver más detalles.</p></div><div class="tools"><input id="search" class="search" placeholder="Buscar producto..." oninput="filterProducts()"></div></div><div id="products" class="products">${list.map(card).join('')}</div></section>`}
function filterProducts(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.product').forEach(el=>{el.style.display=el.innerText.toLowerCase().includes(q)?'grid':'none'})}
function openModal(code){const p=products.find(x=>x.code===code);document.getElementById('modalContent').innerHTML=`<div class="modal-grid"><img src="${p.image}" alt="${p.name}"><div><span class="tag">${p.tag}</span><span class="code">${p.code}</span><h2>${p.name}</h2><p>${p.desc}</p><div class="meta">${p.details.map(d=>`<div><b>${d[0]}:</b> ${d[1]}</div>`).join('')}<div><b>Costo:</b> ${p.price}</div></div><a class="modal-wa" href="${waUrl(p)}" target="_blank" rel="noopener">Pedir por WhatsApp · ${p.code}</a></div></div>`;document.getElementById('modal').classList.add('open');document.getElementById('modal').setAttribute('aria-hidden','false')}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modal').classList.remove('open');document.getElementById('modal').setAttribute('aria-hidden','true')}
function renderSoon(name){document.getElementById('app').innerHTML=`<section class="section"><button class="back" onclick="goHome()">← Menú principal</button><div class="soon"><div class="eyebrow">${name.toUpperCase()}</div><h1>Estamos Buscando Los Mejores Productos Para Ti</h1><p>Apenas Estén Disponibles Te Avisaremos...</p><div class="soon-pill">PRÓXIMAMENTE</div></div></section>`}
function route(){const h=location.hash.replace('#','');if(h==='vibradores'||h==='lenceria')renderCategory(h);else if(h==='proximamente')renderSoon(soon[0]);else renderHome();window.scrollTo(0,0)}
const topbar=document.getElementById('topbar');
const logoSource=HERO_IMAGE;
document.body.style.setProperty('--debora-watermark', `url(\"${logoSource}\")`);
function updateBrandOnScroll(){const y=window.scrollY||document.documentElement.scrollTop||0;topbar.classList.toggle('compact',y>90);document.body.classList.toggle('scrolled',y>160);const heroLogo=document.querySelector('.hero-logo');if(heroLogo)heroLogo.classList.toggle('retracted',y>80)}
window.addEventListener('scroll',updateBrandOnScroll,{passive:true});
window.addEventListener('hashchange',()=>{route();setTimeout(updateBrandOnScroll,50)});route();updateBrandOnScroll();
async function resolveRole(user){if(!user||!db){currentRole='cliente';throw new Error('Sin permisos')}const profile=await Promise.race([db.collection('users').doc(user.uid).get(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),4000))]);if(!profile.exists||profile.data().active!==true||!['admin','vendedor'].includes(profile.data().role)){currentRole='cliente';throw new Error('Perfil no autorizado')}currentRole=profile.data().role}
async function openAccount(){document.getElementById('accountModal').classList.add('open');document.getElementById('accountModal').setAttribute('aria-hidden','false');if(!auth){renderLogin('Firebase está cargando. Intenta ingresar en unos segundos.');return}const user=auth.currentUser;if(!user){renderLogin();return}document.getElementById('accountContent').innerHTML='<p>Verificando permisos...</p>';try{await resolveRole(user);renderDashboard()}catch(error){auth.signOut();renderLogin('No tienes un perfil autorizado para ingresar.')}}
function closeAccount(){document.getElementById('accountModal').classList.remove('open');document.getElementById('accountModal').setAttribute('aria-hidden','true')}
function renderLogin(message=''){document.getElementById('accountContent').innerHTML=`<div class="eyebrow">ÁREA PRIVADA</div><h2>Acceso del equipo</h2><p>${message}</p><form onsubmit="login(event)"><input id="loginEmail" class="search" type="email" placeholder="Correo electrónico" required><input id="loginPassword" class="search" type="password" placeholder="Contraseña" required><button class="modal-wa" type="submit">Ingresar</button></form>`}
async function login(event){event.preventDefault();if(!auth){renderLogin('Firebase no está disponible en este momento.');return}try{await auth.signInWithEmailAndPassword(loginEmail.value,loginPassword.value);await openAccount()}catch(error){renderLogin('No se pudo ingresar: '+error.message)}}
function renderDashboard(){const admin=currentRole==='admin';document.getElementById('accountContent').innerHTML=`<div class="eyebrow">PANEL ${currentRole.toUpperCase()}</div><h2>Gestión DEBORA</h2><p>Sesión: ${auth.currentUser.email}</p>${admin?`<form onsubmit="saveProduct(event)"><input id="productName" class="search" placeholder="Nombre del producto" required><input id="productPrice" class="search" placeholder="Precio (ej. 55000)" type="number" required><select id="productCategory" class="search"><option value="vibradores">Vibradores con App</option><option value="lenceria">Lencería Sexual</option></select><textarea id="productDescription" class="search" placeholder="Descripción" required></textarea><input id="productImage" type="file" accept="image/*" required><button class="modal-wa" type="submit">Subir y guardar producto</button></form><hr><form onsubmit="saveVendor(event)"><h3>Agregar vendedor</h3><input id="vendorName" class="search" placeholder="Nombre" required><input id="vendorEmail" class="search" type="email" placeholder="Correo" required><input id="vendorCommission" class="search" type="number" min="0" max="100" placeholder="Comisión %" required><button class="modal-wa" type="submit">Guardar vendedor</button></form><div id="adminStats" class="meta">Cargando métricas...</div>`:`<div class="soon"><h3>Panel de vendedor</h3><p>Consulta tus ventas y comisiones registradas.</p><div id="vendorStats">Cargando ventas...</div></div>`}<button class="clear-cart" onclick="auth.signOut();closeAccount()">Cerrar sesión</button>`;loadStats()}
async function saveProduct(event){event.preventDefault();const file=productImage.files[0];const data=new FormData();data.append('file',file);data.append('upload_preset','debora_products');data.append('folder','debora/products');const upload=await fetch('https://api.cloudinary.com/v1_1/bgfmynka/image/upload',{method:'POST',body:data});const image=await upload.json();if(!image.secure_url)return alert('No se pudo subir la imagen');const ref=db.collection('products').doc();const product={code:'DE-'+ref.id.slice(0,6).toUpperCase(),cat:productCategory.value,tag:'NUEVO PRODUCTO',name:productName.value,price:money(productPrice.value),image:image.secure_url,desc:productDescription.value,details:[] ,available:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()};await ref.set(product);products.push(product);alert('Producto guardado');event.target.reset();route()}
async function saveVendor(event){event.preventDefault();await db.collection('vendors').add({name:vendorName.value,email:vendorEmail.value,commission:Number(vendorCommission.value),paid:0,pending:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Vendedor guardado');event.target.reset();loadStats()}
async function loadStats(){try{const sales=await db.collection('sales').get();const vendors=await db.collection('vendors').get();const total=sales.docs.reduce((sum,doc)=>sum+Number(doc.data().total||0),0);const target=document.getElementById(currentRole==='admin'?'adminStats':'vendorStats');if(target)target.innerHTML=currentRole==='admin'?`Vendedores registrados: <b>${vendors.size}</b><br>Ventas registradas: <b>${money(total)}</b>`:`Ventas registradas: <b>${money(total)}</b>`}catch(error){const target=document.getElementById('adminStats')||document.getElementById('vendorStats');if(target)target.textContent='Configura Firestore y sus reglas para cargar métricas.'}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeCart();closeAccount()}});updateCartUI();
</script>
</body></html>
